# ezPos edge reverse proxy — implements the domain split:
#   ezpos.com / www.ezpos.com  → Next.js website + customer portal
#   admin.ezpos.com            → the same Next.js app (/saas-admin is
#                                guarded by platform-admin auth anyway)
#   app.ezpos.com              → POS frontend (static SPA)
#   api.ezpos.com              → backend API (IPN callback target)
# TLS: run certbot (see docs/DEPLOYMENT.md) and uncomment the 443 blocks.
server {
    listen 80;
    server_name ezpos.com www.ezpos.com admin.ezpos.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name app.ezpos.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name api.ezpos.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

